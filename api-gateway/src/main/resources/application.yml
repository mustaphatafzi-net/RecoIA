server:
  port: 8080

spring:
  application:
    name: api-gateway

  config:
    import: configserver:http://localhost:8888

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/api/catalog/**
              filters:
                - StripPrefix=2

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            - id: student-service
              uri: lb://student-service
              predicates:
                - Path=/api/students/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka