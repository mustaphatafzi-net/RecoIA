server:
  port: 8083

spring:
  application:
    name: student-service
  config:
    import: configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:studentdb
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
